name: ML Training Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python 3.12
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies dari conda.yaml (menggunakan pip untuk CI)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn==1.6.1
          pip install mlflow==2.19.0
          pip install pandas==2.2.3
          pip install numpy==2.2.1
          pip install matplotlib==3.10.0

      # Step 4: Jalankan training model
      - name: Run ML Training
        run: |
          cd MLProject
          python modelling.py

      # Step 5: Upload model artifacts ke GitHub
      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-model-artifacts
          path: |
            MLProject/mlruns/
          retention-days: 30

      # Step 6: Commit artifacts kembali ke repository (Skilled level)
      - name: Commit artifacts to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A MLProject/mlruns/ || true
          git diff --staged --quiet || git commit -m "chore: update ML training artifacts [skip ci]"
          git push || echo "Nothing to push"

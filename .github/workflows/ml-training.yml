name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLProject/california_housing_preprocessing/california_housing_hasil_preprocessing.zip"
  TARGET_VAR: "MedHouseVal"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          echo $CSV_URL
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn pandas numpy matplotlib

      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=$GITHUB_WORKSPACE/MLProject/mlruns" >> $GITHUB_ENV

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local 
          
      - name: Install Python dependencies
        run: |
          echo "Installing dependencies for upload if needed"

      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ml-model-artifacts
          path: |
            MLProject/mlruns/
          retention-days: 30
